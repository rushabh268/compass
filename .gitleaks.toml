  "\\A\\-\\-\\-\\-\\-BEGIN PRIVATE KEY\\-\\-\\-\\-\\-\\\\n      QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVo=\\\\n    \\-\\-\\-\\-\\-END PRIVATE KEY\\-\\-\\-\\-\\-\\z",
  "\\A\\-\\-\\-\\-\\-BEGIN PRIVATE KEY\\-\\-\\-\\-\\-\\\\n    QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVo=\\\\n    \\-\\-\\-\\-\\-END PRIVATE KEY\\-\\-\\-\\-\\-\\z",
  "\\A\\-\\-\\-\\-\\-BEGIN PRIVATE KEY\\-\\-\\-\\-\\-\\\\n    \\[REDACTED:pem\\-private\\-key\\]\\\\n    \\-\\-\\-\\-\\-END PRIVATE KEY\\-\\-\\-\\-\\-\",\\n      \"line\": 2,\\n      \"column\": 5\\n    \\},\\n    \\{\\n      \"name\": \"PEM private key body with trailing whitespace\",\\n      \"ruleID\": \"pem\\-private\\-key\",\\n      \"text\": \"\\-\\-\\-\\-\\-BEGIN PRIVATE KEY\\-\\-\\-\\-\\-\\z",
