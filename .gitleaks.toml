  "\\A\\-\\-\\-\\-\\-BEGIN PRIVATE KEY\\-\\-\\-\\-\\-\\\\nQUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVo=\\\\n\\-\\-\\-\\-\\-END RSA PRIVATE KEY\\-\\-\\-\\-\\-\\\\nafter boundary\",\\n      \"redacted\": \"\\-\\-\\-\\-\\-BEGIN PRIVATE KEY\\-\\-\\-\\-\\-\\z",
